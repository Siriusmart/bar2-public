plugins {
    id "fabric-loom"
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        name = "babbaj"
        url = "https://babbaj.github.io/maven/"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
    // Baritone (https://github.com/MeteorDevelopment/baritone)
    modImplementation "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"
    // Baritone ships nether-pathfinder as a jar-in-jar, which Fabric Loader only
    // unpacks in production, so runClient needs it on the classpath directly
    runtimeOnly "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("processResources") {
    def propertyMap = [
        "version"   : project.version,
        "mc_version": project.minecraft_version,
    ]

    inputs.properties(propertyMap)

    filesMatching("fabric.mod.json") {
        expand(propertyMap)
    }
}

tasks.named("jar") {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}
