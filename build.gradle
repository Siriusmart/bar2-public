plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        name = "babbaj"
        url = "https://babbaj.github.io/maven/"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:${project.meteor_version}"
    // Baritone (https://github.com/MeteorDevelopment/baritone)
    implementation "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"
    // Baritone ships nether-pathfinder as a jar-in-jar, which Fabric Loader only
    // unpacks in production, so runClient needs it on the classpath directly
    runtimeOnly "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}
